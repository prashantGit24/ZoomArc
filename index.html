<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <title>ZoomArc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before the stylesheet paints, so there's no flash of the
      // wrong theme on launch. Kept in sync with src/theme.js's storage key.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('zoomarc:theme')
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
